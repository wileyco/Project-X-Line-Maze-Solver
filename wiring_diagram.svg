<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:15px;fill:#17202a}.box{fill:#f3f6fa;stroke:#34495e;stroke-width:2}.warn{fill:#fff3cd;stroke:#856404;stroke-width:2}.line{stroke:#34495e;stroke-width:2;fill:none}</style>
<text x="500" y="30" text-anchor="middle" font-size="23">LMS wiring overview — confirm pin conflict first</text>
<rect class="box" x="40" y="75" width="280" height="170" rx="8"/><text x="180" y="103" text-anchor="middle" font-size="20">ESP32-WROOM-32</text><text x="60" y="132">Sensor ADC inputs:</text><text x="60" y="155">S1 GPIO34; S2 GPIO35</text><text x="60" y="178">S3 GPIO32; S4 GPIO33</text><text x="60" y="201">S5 GPIO25</text><text x="60" y="228">3.3 V logic / common GND</text>
<rect class="box" x="380" y="75" width="260" height="170" rx="8"/><text x="510" y="103" text-anchor="middle" font-size="20">L298N</text><text x="400" y="132">ENA GPIO14; IN1 GPIO27</text><text x="400" y="155">IN2 GPIO26</text><text x="400" y="178">ENB GPIO13; IN3 GPIO12</text><text x="400" y="201">IN4 GPIO11 (Appendix A)</text><text x="400" y="228">Motor supply: 11.1 V nominal</text>
<rect class="box" x="700" y="75" width="260" height="170" rx="8"/><text x="830" y="103" text-anchor="middle" font-size="20">Sensor array + motors</text><text x="720" y="140">Five analog sensor outputs</text><text x="720" y="165">Left motor → OUT1/OUT2</text><text x="720" y="190">Right motor → OUT3/OUT4</text><text x="720" y="215">Sensor outputs ≤ 3.3 V</text>
<path class="line" d="M320 145 H380 M640 145 H700"/>
<rect class="warn" x="40" y="300" width="920" height="95" rx="8"/><text x="60" y="330" font-size="18">Important pin warning</text><text x="60" y="355">Appendix A lists GPIO11 for L298N IN4. On typical ESP32-WROOM-32 modules, GPIO6–11 are used by SPI flash.</text><text x="60" y="378">Do not connect hardware using this mapping until the club provides/approves a corrected pin assignment.</text>
<rect class="box" x="40" y="430" width="920" height="135" rx="8"/><text x="60" y="460" font-size="18">Power and safety</text><text x="60" y="485">3S LiPo (+) → L298N motor supply; regulated 5 V → ESP32 VIN/5V; ESP32 3V3 → compatible sensor supply.</text><text x="60" y="510">Join battery negative, driver GND and ESP32 GND. Never apply 11.1 V to the ESP32 3V3 pin.</text><text x="60" y="535">Check motor stall current, driver thermal limits, battery C-rating, polarity and regulator arrangement.</text></svg>