<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
<rect width="800" height="420" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#17202a}.edge{stroke:#34495e;stroke-width:4;fill:none}.node{fill:#eaf2f8;stroke:#34495e;stroke-width:2}.exit{fill:#d5f5e3;stroke:#1e8449;stroke-width:2}</style>
<text x="400" y="32" text-anchor="middle" font-size="24">Example graph for Task 8 (not to scale)</text>
<path class="edge" d="M100 200 H300 M100 200 V100 H300 M300 200 H500 H700"/>
<circle class="node" cx="100" cy="200" r="28"/><text x="100" y="206" text-anchor="middle">A</text>
<circle class="node" cx="300" cy="100" r="28"/><text x="300" y="106" text-anchor="middle">B</text>
<circle class="node" cx="300" cy="200" r="28"/><text x="300" y="206" text-anchor="middle">C</text>
<circle class="node" cx="300" cy="40" r="20"/><text x="300" y="46" text-anchor="middle">D</text><path class="edge" d="M300 72 V60"/>
<circle class="node" cx="500" cy="200" r="28"/><text x="500" y="206" text-anchor="middle">E</text>
<circle class="exit" cx="700" cy="200" r="28"/><text x="700" y="206" text-anchor="middle">EXIT</text>
<text x="400" y="285" text-anchor="middle">Example: DFS explores A → B → D (dead end), backtracks, then A → C → E → EXIT.</text>
<text x="400" y="320" text-anchor="middle">Once the graph is known, BFS can select the shortest path by number of edges.</text>
<text x="400" y="355" text-anchor="middle">A = start/junction; B = branch; D = dead end; C/E = corridor junctions.</text></svg>